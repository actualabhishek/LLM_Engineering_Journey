# /etc/nginx/sites-available/forex-ai-trader
# Symlink: ln -s /etc/nginx/sites-available/forex-ai-trader /etc/nginx/sites-enabled/

# ── Rate limiting zone ────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=20r/m;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

# ── HTTPS: Webhook server (port 8000) ─────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # SSL — replace with certbot managed certs
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;

    # Webhook endpoint — rate limited
    location /webhook {
        limit_req zone=webhook_limit burst=10 nodelay;
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # Health check + status endpoints (unrestricted)
    location ~ ^/(health|status|kill-switch) {
        proxy_pass       http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # Restrict kill-switch to trusted IPs only
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        # allow YOUR_VPN_IP;
        deny  all;
    }

    # Block everything else on this vhost
    location / {
        return 403;
    }
}

# ── HTTPS: Streamlit dashboard (port 8501) ────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name dashboard.your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Basic auth — protect dashboard behind a password
    auth_basic           "ForexAI Dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Restrict access to trusted IPs only
    # allow YOUR_HOME_IP;
    # allow YOUR_VPN_IP;
    # deny  all;

    location / {
        proxy_pass         http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 86400;
    }

    # Streamlit static assets
    location /_stcore/stream {
        proxy_pass         http://127.0.0.1:8501/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
